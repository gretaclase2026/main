        async function startDownload() {
            const apiKey = document.getElementById('apiKey').value.trim();
            const btn = document.getElementById('btnDownload');

            if (!apiKey) {
                showStatus("Por favor, introduce una API Key válida.", "error");
                return;
            }

            btn.disabled = true;
            showStatus("Procesando descargas...", "success");

            try {
                for (let i = 0; i < phrases.length; i++) {
                    const item = phrases[i];
                    showStatus(`Procesando (${i + 1}/${phrases.length}): ${item.filename} - ${item.text}`, "success");
                    await generateAndDownloadDualAudio(apiKey, item.text, item.filename);
                    await new Promise(resolve => setTimeout(resolve, 400));
                }
                showStatus("¡Todas las descargas se han completado con éxito!", "success");
            } catch (error) {
                showStatus("Error: " + error.message, "error");
            } finally {
                btn.disabled = false;
            }
        }

        async function synthesizePart(apiKey, text, languageCode, voiceName) {
            const url = `https://texttospeech.googleapis.com/v1/text:synthesize?key=${apiKey}`;
            const payload = {
                input: { text: text },
                voice: {
                    languageCode: languageCode,
                    name: voiceName
                },
                audioConfig: {
                    audioEncoding: "LINEAR16"
                }
            };

            const response = await fetch(url, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(payload)
            });

            if (!response.ok) {
                const errData = await response.json();
                throw new Error(errData.error?.message || "Error en la API de Google Cloud");
            }

            const data = await response.json();
            return base64ToArrayBuffer(data.audioContent);
        }

        async function generateAndDownloadDualAudio(apiKey, text, filename) {
            const buffer1 = await synthesizePart(apiKey, text, "en-US", "en-US-Studio-Q");
            // Voz UK Femenina Studio corregida:
            const buffer2 = await synthesizePart(apiKey, text, "en-GB", "en-GB-Studio-C");

            const sampleRate = 24000; 
            const silenceDurationSec = 0.5; 
            const silenceNumSamples = Math.floor(sampleRate * silenceDurationSec);
            const silenceBuffer = new ArrayBuffer(silenceNumSamples * 2);

            const combinedPCM = appendBuffer(appendBuffer(buffer1, silenceBuffer), buffer2);
            const wavBuffer = createWavFile(combinedPCM, sampleRate);

            const blob = new Blob([wavBuffer], { type: 'audio/wav' });
            const linkSource = URL.createObjectURL(blob);
            const downloadLink = document.createElement("a");
            downloadLink.href = linkSource;
            downloadLink.download = filename;
            document.body.appendChild(downloadLink);
            downloadLink.click();
            document.body.removeChild(downloadLink);
            URL.revokeObjectURL(linkSource);
        }

        function base64ToArrayBuffer(base64) {
            const binaryString = window.atob(base64);
            const len = binaryString.length;
            const bytes = new Uint8Array(len);
            for (let i = 0; i < len; i++) {
                bytes[i] = binaryString.charCodeAt(i);
            }
            return bytes.buffer;
        }

        function appendBuffer(buffer1, buffer2) {
            const tmp = new Uint8Array(buffer1.byteLength + buffer2.byteLength);
            tmp.set(new Uint8Array(buffer1), 0);
            tmp.set(new Uint8Array(buffer2), buffer1.byteLength);
            return tmp.buffer;
        }

        function createWavFile(pcmBuffer, sampleRate) {
            const numChannels = 1;
            const bitsPerSample = 16;
            const byteRate = sampleRate * numChannels * (bitsPerSample / 8);
            const blockAlign = numChannels * (bitsPerSample / 8);
            const dataSize = pcmBuffer.byteLength;
            const chunkSize = 36 + dataSize;

            const headerBuffer = new ArrayBuffer(44);
            const view = new DataView(headerBuffer);

            writeString(view, 0, 'RIFF');
            view.setUint32(4, chunkSize, true);
            writeString(view, 8, 'WAVE');

            writeString(view, 12, 'fmt ');
            view.setUint32(16, 16, true);
            view.setUint16(20, 1, true);
            view.setUint16(22, numChannels, true);
            view.setUint32(24, sampleRate, true);
            view.setUint32(28, byteRate, true);
            view.setUint16(32, blockAlign, true);
            view.setUint16(34, bitsPerSample, true);

            writeString(view, 36, 'data');
            view.setUint32(40, dataSize, true);

            return appendBuffer(headerBuffer, pcmBuffer);
        }

        function writeString(view, offset, string) {
            for (let i = 0; i < string.length; i++) {
                view.setUint8(offset + i, string.charCodeAt(i));
            }
        }

        function showStatus(message, type) {
            const statusDiv = document.getElementById('status');
            statusDiv.innerText = message;
            statusDiv.className = type;
            statusDiv.style.display = 'block';
