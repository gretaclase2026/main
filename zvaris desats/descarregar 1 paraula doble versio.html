<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Generador Individual de Audio Dual</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f4f7f6;
            color: #333;
            padding: 20px;
            max-width: 600px;
            margin: 40px auto;
            border-radius: 8px;
            box-shadow: 0 4px 8px rgba(0,0,0,0.1);
        }
        h1 {
            color: #2c3e50;
            font-size: 24px;
            margin-bottom: 20px;
        }
        .form-group {
            margin-bottom: 15px;
        }
        label {
            display: block;
            margin-bottom: 5px;
            font-weight: bold;
        }
        input[type="text"], input[type="number"] {
            width: 100%;
            padding: 10px;
            border: 1px solid #ccc;
            border-radius: 4px;
            box-sizing: border-box;
        }
        button {
            background-color: #3498db;
            color: white;
            padding: 10px 15px;
            border: none;
            border-radius: 4px;
            cursor: pointer;
            font-size: 16px;
            width: 100%;
            margin-top: 10px;
        }
        button:hover {
            background-color: #2980b9;
        }
        button:disabled {
            background-color: #bdc3c7;
            cursor: not-allowed;
        }
        #status {
            margin-top: 20px;
            padding: 10px;
            border-radius: 4px;
            display: none;
            white-space: pre-wrap;
            word-break: break-all;
        }
        .success {
            background-color: #d4edda;
            color: #155724;
            border: 1px solid #c3e6cb;
        }
        .error {
            background-color: #f8d7da;
            color: #721c24;
            border: 1px solid #f5c6cb;
        }
    </style>
</head>
<body>

    <h1>Descarga de Audio Individual Dual</h1>
    
    <div class="form-group">
        <label for="apiKey">API Key de Google Cloud:</label>
        <input type="text" id="apiKey" placeholder="AIzaSy...">
    </div>

    <div class="form-group">
        <label for="phraseText">Palabra o frase en inglés:</label>
        <input type="text" id="phraseText" placeholder="Ejemplo: thrift">
    </div>

    <div class="form-group">
        <label for="audioNumber">Número de audio (ejemplo: 569):</label>
        <input type="number" id="audioNumber" placeholder="Ejemplo: 569">
    </div>

    <button id="btnDownload" onclick="startSingleDownload()">Generar y Descargar Audio</button>

    <div id="status"></div>

    <script>
        async function startSingleDownload() {
            const apiKey = document.getElementById('apiKey').value.trim();
            const text = document.getElementById('phraseText').value.trim();
            const num = document.getElementById('audioNumber').value.trim();
            const btn = document.getElementById('btnDownload');

            if (!apiKey) {
                showStatus("Por favor, introduce una API Key válida.", "error");
                return;
            }
            if (!text) {
                showStatus("Por favor, introduce la palabra o frase.", "error");
                return;
            }
            if (!num) {
                showStatus("Por favor, introduce el número de audio.", "error");
                return;
            }

            const filename = `f${num}.mp3`;

            btn.disabled = true;
            showStatus(`Generando audio para "${text}" (${filename})...`, "success");

            try {
                await generateAndDownloadDualAudio(apiKey, text, filename);
                showStatus(`¡Audio ${filename} generado y descargado con éxito!`, "success");
            } catch (error) {
                console.error(error);
                showStatus("Error: " + error.message, "error");
            } finally {
                btn.disabled = false;
            }
        }

        async function synthesizePart(apiKey, text, languageCode, voiceName) {
            const url = `https://texttospeech.googleapis.com/v1/text:synthesize?key=${apiKey}`;
            const payload = {
                input: { text: text },
                voice: {
                    languageCode: languageCode,
                    name: voiceName
                },
                audioConfig: {
                    audioEncoding: "LINEAR16"
                }
            };

            const response = await fetch(url, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(payload)
            });

            const data = await response.json();

            if (!response.ok) {
                throw new Error(data.error?.message || JSON.stringify(data));
            }

            return base64ToArrayBuffer(data.audioContent);
        }

        async function generateAndDownloadDualAudio(apiKey, text, filename) {
            const buffer1 = await synthesizePart(apiKey, text, "en-US", "en-US-Studio-Q");
            const buffer2 = await synthesizePart(apiKey, text, "en-GB", "en-GB-Studio-C");

            const sampleRate = 24000; 
            const silenceDurationSec = 0.5; 
            const silenceNumSamples = Math.floor(sampleRate * silenceDurationSec);
            const silenceBuffer = new ArrayBuffer(silenceNumSamples * 2);

            const combinedPCM = appendBuffer(appendBuffer(buffer1, silenceBuffer), buffer2);
            const wavBuffer = createWavFile(combinedPCM, sampleRate);

            const blob = new Blob([wavBuffer], { type: 'audio/mp3' });
            const linkSource = URL.createObjectURL(blob);
            const downloadLink = document.createElement("a");
            downloadLink.href = linkSource;
            downloadLink.download = filename;
            document.body.appendChild(downloadLink);
            downloadLink.click();
            document.body.removeChild(downloadLink);
            URL.revokeObjectURL(linkSource);
        }

        function base64ToArrayBuffer(base64) {
            const binaryString = window.atob(base64);
            const len = binaryString.length;
            const bytes = new Uint8Array(len);
            for (let i = 0; i < len; i++) {
                bytes[i] = binaryString.charCodeAt(i);
            }
            return bytes.buffer;
        }

        function appendBuffer(buffer1, buffer2) {
            const tmp = new Uint8Array(buffer1.byteLength + buffer2.byteLength);
            tmp.set(new Uint8Array(buffer1), 0);
            tmp.set(new Uint8Array(buffer2), buffer1.byteLength);
            return tmp.buffer;
        }

        function createWavFile(pcmBuffer, sampleRate) {
            const numChannels = 1;
            const bitsPerSample = 16;
            const byteRate = sampleRate * numChannels * (bitsPerSample / 8);
            const blockAlign = numChannels * (bitsPerSample / 8);
            const dataSize = pcmBuffer.byteLength;
            const chunkSize = 36 + dataSize;

            const headerBuffer = new ArrayBuffer(44);
            const view = new DataView(headerBuffer);

            writeString(view, 0, 'RIFF');
            view.setUint32(4, chunkSize, true);
            writeString(view, 8, 'WAVE');

            writeString(view, 12, 'fmt ');
            view.setUint32(16, 16, true);
            view.setUint16(20, 1, true);
            view.setUint16(22, numChannels, true);
            view.setUint32(24, sampleRate, true);
            view.setUint32(28, byteRate, true);
            view.setUint16(32, blockAlign, true);
            view.setUint16(34, bitsPerSample, true);

            writeString(view, 36, 'data');
            view.setUint32(40, dataSize, true);

            return appendBuffer(headerBuffer, pcmBuffer);
        }

        function writeString(view, offset, string) {
            for (let i = 0; i < string.length; i++) {
                view.setUint8(offset + i, string.charCodeAt(i));
            }
        }

        function showStatus(message, type) {
            const statusDiv = document.getElementById('status');
            statusDiv.innerText = message;
            statusDiv.className = type;
            statusDiv.style.display = 'block';
        }
    </script>

</body>
</html>
